<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlotaRD">
<link rel="manifest" href="manifest.json">
<title>FlotaRD — Gestión de Flotilla</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root {
    --primary: #185FA5; --primary-dark: #0C447C; --primary-light: #E6F1FB;
    --bg: #F4F3EF; --card: #FFFFFF; --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --text: #1a1a18; --text-muted: #6b6b67; --text-hint: #9c9a92;
    --green: #3B6D11; --green-bg: #EAF3DE;
    --amber: #854F0B; --amber-bg: #FAEEDA;
    --red: #A32D2D; --red-bg: #FCEBEB;
    --blue: #185FA5; --blue-bg: #E6F1FB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --card: #252523; --border: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.2);
      --text: #e8e6de; --text-muted: #9c9a92; --text-hint: #6b6b67; --primary-light: #0c2d4a;
      --green-bg: #1a2e0a; --amber-bg: #2e1f05; --red-bg: #2e0f0f; --blue-bg: #0c2d4a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

  .app { display: flex; height: 100vh; height: 100dvh; }
  .sidebar { width: 220px; background: var(--card); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; transition: transform 0.25s ease; }
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 0.5px solid var(--border); }
  .sidebar-logo-title { font-size: 16px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .sidebar-logo-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .nav-section { font-size: 10px; font-weight: 700; color: var(--text-hint); padding: 16px 18px 4px; text-transform: uppercase; letter-spacing: 0.8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 18px; cursor: pointer; color: var(--text-muted); font-size: 14px; border-left: 2.5px solid transparent; transition: all 0.15s; user-select: none; }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active { color: var(--primary); border-left-color: var(--primary); background: var(--primary-light); font-weight: 600; }
  .nav-item i { font-size: 18px; }
  .nav-badge { margin-left: auto; background: var(--red-bg); color: var(--red); font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 700; }

  .main { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }

  .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 0.5px solid var(--border); padding: 6px 0 env(safe-area-inset-bottom, 6px); z-index: 50; }
  .bottom-nav-inner { display: flex; justify-content: space-around; }
  .bnav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 10px; cursor: pointer; color: var(--text-muted); font-size: 10px; border-radius: 8px; transition: color 0.15s; position: relative; }
  .bnav-item i { font-size: 22px; }
  .bnav-item.active { color: var(--primary); }
  .bnav-dot { position: absolute; top: 4px; right: 6px; width: 7px; height: 7px; background: var(--red); border-radius: 50%; border: 1.5px solid var(--card); }

  .topbar { display: none; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .topbar-title { font-size: 16px; font-weight: 700; color: var(--primary); flex: 1; }
  .topbar-sync { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .hamburger { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 60; }
  .overlay.show { display: block; }

  @media (max-width: 680px) {
    .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 70; transform: translateX(-100%); width: 260px; }
    .sidebar.open { transform: translateX(0); }
    .topbar { display: flex; }
    .bottom-nav { display: block; }
    .main { padding: 14px 14px calc(72px + env(safe-area-inset-bottom, 0px)) 14px; }
  }

  .card { background: var(--card); border: 0.5px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 700; }

  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (min-width: 500px) { .metrics { grid-template-columns: repeat(4, 1fr); } }
  .metric { background: var(--bg); border-radius: 10px; padding: 14px; }
  .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .metric-value { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .metric-sub { font-size: 11px; color: var(--text-hint); margin-top: 2px; }
  .c-blue { color: var(--blue); } .c-green { color: var(--green); } .c-amber { color: var(--amber); } .c-red { color: var(--red); }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 700; color: var(--text-muted); border-bottom: 0.5px solid var(--border); text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }
  .badge-gray { background: var(--bg); color: var(--text-muted); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; border: 0.5px solid var(--border-strong); background: var(--card); color: var(--text); transition: all 0.15s; font-family: inherit; font-weight: 600; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
  .btn-danger { color: var(--red); border-color: #F7C1C1; }

  .fab { position: fixed; bottom: calc(72px + env(safe-area-inset-bottom, 0px) + 14px); right: 16px; width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color: #fff; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 4px 16px rgba(24,95,165,0.45); z-index: 45; transition: transform 0.15s; }
  .fab:active { transform: scale(0.92); }
  @media (max-width: 680px) { .fab { display: flex; } }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  @media (min-width: 480px) { .modal-overlay { align-items: center; } }
  .modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  @media (min-width: 480px) { .modal { border-radius: 16px; width: 460px; max-height: 85vh; } }
  .modal-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; display: block; font-weight: 600; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; border-top: 0.5px solid var(--border); padding-top: 16px; }
  input, select, textarea { width: 100%; padding: 11px 13px; border: 0.5px solid var(--border-strong); border-radius: 10px; font-size: 15px; font-family: inherit; background: var(--card); color: var(--text); -webkit-appearance: none; appearance: none; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(24,95,165,0.15); }
  textarea { resize: vertical; min-height: 70px; }

  .vehicle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; }
  .vehicle-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 14px; padding: 14px; }
  .v-icon { width: 42px; height: 42px; background: var(--blue-bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .v-icon i { color: var(--blue); font-size: 22px; }
  .v-name { font-size: 14px; font-weight: 700; }
  .v-plate { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .v-stats { display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .vstat { font-size: 11px; color: var(--text-muted); }
  .vstat span { display: block; font-size: 13px; font-weight: 700; color: var(--text); }
  .v-actions { display: flex; gap: 6px; margin-top: 10px; }

  .alert-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; margin-bottom: 10px; }
  .alert-icon { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .alert-icon.red { background: var(--red-bg); }
  .alert-icon.amber { background: var(--amber-bg); }

  .progress-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .progress-fill { height: 100%; border-radius: 3px; }

  .page-header { margin-bottom: 18px; }
  .page-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .page-title { font-size: 20px; font-weight: 700; }
  .page-sub { font-size: 13px; color: var(--text-muted); }

  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty i { font-size: 44px; margin-bottom: 12px; display: block; }

  /* Loading / sync */
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; flex-direction: column; gap: 12px; color: var(--text-muted); }
  .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; }
  .sync-dot.syncing { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .toast { position: fixed; bottom: calc(80px + env(safe-area-inset-bottom,0px)); left: 50%; transform: translateX(-50%); background: #1a1a18; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-title"><i class="ti ti-truck"></i> FlotaRD</div>
      <div class="sidebar-logo-sub">Gestión de flotilla · <span class="sync-dot" id="sync-dot"></span><span id="sync-label">Conectando...</span></div>
    </div>
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="showPage('dashboard');closeSidebar()"><i class="ti ti-dashboard"></i> Dashboard</div>
    <div class="nav-item" onclick="showPage('vehiculos');closeSidebar()"><i class="ti ti-car"></i> Vehículos</div>
    <div class="nav-section">Registros</div>
    <div class="nav-item" onclick="showPage('mantenimientos');closeSidebar()"><i class="ti ti-tool"></i> Mantenimientos</div>
    <div class="nav-item" onclick="showPage('combustible');closeSidebar()"><i class="ti ti-gas-station"></i> Combustible</div>
    <div class="nav-section">Análisis</div>
    <div class="nav-item" onclick="showPage('alertas');closeSidebar()"><i class="ti ti-bell"></i> Alertas <span class="nav-badge" id="alert-badge" style="display:none"></span></div>
    <div class="nav-item" onclick="showPage('reportes');closeSidebar()"><i class="ti ti-chart-bar"></i> Reportes</div>
  </nav>

  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
    <div class="topbar" id="topbar">
      <button class="hamburger" onclick="toggleSidebar()"><i class="ti ti-menu-2" style="font-size:22px"></i></button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-sync"><span class="sync-dot" id="sync-dot-top"></span><span id="sync-label-top">...</span></div>
    </div>
    <main class="main" id="main-content">
      <div class="loading"><div class="spinner"></div><span>Conectando con Firebase...</span></div>
    </main>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <div class="bnav-item active" id="bnav-dashboard" onclick="showPage('dashboard')"><i class="ti ti-dashboard"></i><span>Inicio</span></div>
    <div class="bnav-item" id="bnav-vehiculos" onclick="showPage('vehiculos')"><i class="ti ti-car"></i><span>Vehículos</span></div>
    <div class="bnav-item" id="bnav-mantenimientos" onclick="showPage('mantenimientos')"><i class="ti ti-tool"></i><span>Mantenimiento</span></div>
    <div class="bnav-item" id="bnav-combustible" onclick="showPage('combustible')"><i class="ti ti-gas-station"></i><span>Combustible</span></div>
    <div class="bnav-item" id="bnav-alertas" onclick="showPage('alertas')"><i class="ti ti-bell"></i><span>Alertas</span><span class="bnav-dot" id="bnav-dot" style="display:none"></span></div>
  </div>
</nav>

<button class="fab" id="fab" onclick="fabAction()"><i class="ti ti-plus"></i></button>
<div id="modal-container"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ======= FIREBASE CONFIG =======
const firebaseConfig = {
  apiKey: "AIzaSyBJriqaE-Mi0Due2CB4MIWIZmyPsMMo-SU",
  authDomain: "prueba-9e3b8.firebaseapp.com",
  projectId: "prueba-9e3b8",
  storageBucket: "prueba-9e3b8.firebasestorage.app",
  messagingSenderId: "963411279",
  appId: "1:963411279:web:c4f074ac7a12aebd37193a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ======= STATE =======
let state = { vehiculos: [], mantenimientos: [], combustible: [] };
let currentPage = 'dashboard';
let loaded = { v: false, m: false, c: false };

// ======= SYNC STATUS =======
function setSynced() {
  ['sync-dot','sync-dot-top'].forEach(id => { const el=document.getElementById(id); if(el){el.className='sync-dot';} });
  ['sync-label','sync-label-top'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent='Sincronizado'; });
}
function setSyncing() {
  ['sync-dot','sync-dot-top'].forEach(id => { const el=document.getElementById(id); if(el) el.className='sync-dot syncing'; });
  ['sync-label','sync-label-top'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent='Guardando...'; });
}

// ======= TOAST =======
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ======= REALTIME LISTENERS =======
function initListeners() {
  onSnapshot(query(collection(db,'vehiculos'), orderBy('createdAt','asc')), snap => {
    state.vehiculos = snap.docs.map(d => ({...d.data(), id: d.id}));
    loaded.v = true; checkLoaded();
  });
  onSnapshot(query(collection(db,'mantenimientos'), orderBy('fecha','desc')), snap => {
    state.mantenimientos = snap.docs.map(d => ({...d.data(), id: d.id}));
    loaded.m = true; checkLoaded();
  });
  onSnapshot(query(collection(db,'combustible'), orderBy('fecha','desc')), snap => {
    state.combustible = snap.docs.map(d => ({...d.data(), id: d.id}));
    loaded.c = true; checkLoaded();
  });
}

function checkLoaded() {
  if (loaded.v && loaded.m && loaded.c) {
    setSynced();
    renderPage();
  }
}

// ======= HELPERS =======
const getV = (id) => state.vehiculos.find(v => v.id === id);
const fmt = (n) => Math.round(n).toLocaleString('es-DO');
const fmtM = (n) => 'RD$' + Math.round(n).toLocaleString('es-DO');
const dAgo = (s) => { if(!s) return '—'; const d=Math.floor((new Date()-new Date(s))/86400000); return d===0?'Hoy':d===1?'Ayer':`Hace ${d} días`; };

function getAlerts() {
  const al = [];
  state.vehiculos.forEach(v => {
    const mv = state.mantenimientos.filter(m => m.vehiculoId === v.id);
    if (!mv.length) { al.push({nivel:'amarillo', vehiculo:v.nombre, placa:v.placa, msg:'Sin registros de mantenimiento', vid:v.id}); return; }
    const lm = mv[0];
    if (lm.proximoKm && v.odometro >= lm.proximoKm)
      al.push({nivel:'rojo', vehiculo:v.nombre, placa:v.placa, msg:`Mantenimiento vencido — ${fmt(v.odometro)} km / próx: ${fmt(lm.proximoKm)} km`, vid:v.id});
    else if (lm.proximoKm && (lm.proximoKm - v.odometro) <= 2000)
      al.push({nivel:'amarillo', vehiculo:v.nombre, placa:v.placa, msg:`Próximo mantenimiento en ${fmt(lm.proximoKm - v.odometro)} km`, vid:v.id});
  });
  return al;
}

const vIcon = t => t==='Van'?'ti-bus':t==='Camión'?'ti-truck':'ti-car';
const vStatus = v => {
  const mv = state.mantenimientos.filter(m => m.vehiculoId === v.id);
  if (!mv.length) return 'gray';
  const lm = mv[0];
  if (!lm.proximoKm) return 'gray';
  if (v.odometro >= lm.proximoKm) return 'red';
  if ((lm.proximoKm - v.odometro) <= 2000) return 'amber';
  return 'green';
};
const statusLabel = {green:'Al día', amber:'Próximo', red:'Vencido', gray:'Sin datos'};

// ======= NAVIGATION =======
const pageNames = { dashboard:'Dashboard', vehiculos:'Vehículos', mantenimientos:'Mantenimientos', combustible:'Combustible', alertas:'Alertas', reportes:'Reportes' };
const fabPages = ['vehiculos','mantenimientos','combustible'];

window.showPage = function(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navMap = ['dashboard','vehiculos','mantenimientos','combustible','alertas','reportes'];
  document.querySelectorAll('.nav-item').forEach((el,i) => { if(navMap[i]===page) el.classList.add('active'); });
  document.querySelectorAll('.bnav-item').forEach(el => el.classList.remove('active'));
  const bn = document.getElementById('bnav-'+page); if(bn) bn.classList.add('active');
  const tb = document.getElementById('topbar-title'); if(tb) tb.textContent = pageNames[page]||page;
  const fab = document.getElementById('fab'); if(fab) fab.style.display = fabPages.includes(page)?'flex':'none';
  renderPage();
};

window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); };
window.closeSidebar = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); };
window.fabAction = () => { if(currentPage==='vehiculos') openModal('vehiculo'); else if(currentPage==='mantenimientos') openModal('mantenimiento'); else if(currentPage==='combustible') openModal('combustible'); };

function renderPage() {
  const el = document.getElementById('main-content');
  const alerts = getAlerts();
  const ab = document.getElementById('alert-badge'); if(ab){ab.textContent=alerts.length;ab.style.display=alerts.length?'inline':'none';}
  const dot = document.getElementById('bnav-dot'); if(dot) dot.style.display=alerts.length?'block':'none';
  const pages = {dashboard:renderDashboard, vehiculos:renderVehiculos, mantenimientos:renderMantenimientos, combustible:renderCombustible, alertas:renderAlertas, reportes:renderReportes};
  el.innerHTML = (pages[currentPage]||renderDashboard)();
}

// ======= DASHBOARD =======
function renderDashboard() {
  const tC = state.combustible.reduce((s,c)=>s+(c.litros*c.precio),0);
  const tM = state.mantenimientos.reduce((s,m)=>s+m.costo,0);
  const alerts = getAlerts();
  const rm = state.mantenimientos.slice(0,5);
  const rc = state.combustible.slice(0,5);
  return `
  <div class="page-header"><div class="page-title">Dashboard</div><div class="page-sub">Vista general de tu flotilla</div></div>
  <div class="metrics">

// ======= REPORTES =======
function renderReportes() {
  const gv = state.vehiculos.map(v=>({
    nombre:v.nombre.split(' ').slice(-1)[0], placa:v.placa,
    comb:state.combustible.filter(c=>c.vehiculoId===v.id).reduce((s,c)=>s+(c.litros*c.precio),0),
    mant:state.mantenimientos.filter(m=>m.vehiculoId===v.id).reduce((s,m)=>s+m.costo,0),
  })).map(x=>({...x,total:x.comb+x.mant})).sort((a,b)=>b.total-a.total);
  const maxT = Math.max(...gv.map(x=>x.total),1);
  const tipos = {};
  state.mantenimientos.forEach(m=>{ tipos[m.tipo]=(tipos[m.tipo]||0)+1; });
  const tTotalM = state.mantenimientos.reduce((s,m)=>s+m.costo,0);
  const tTotalC = state.combustible.reduce((s,c)=>s+(c.litros*c.precio),0);
  return `
  <div class="page-header"><div class="page-title">Reportes</div><div class="page-sub">Análisis de gastos de tu flotilla</div></div>
  <div class="card">
    <div class="card-title" style="margin-bottom:16px">Gasto total por vehículo</div>
    ${gv.length?gv.map(v=>`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span><b>${v.nombre}</b> <span style="color:var(--text-muted)">${v.placa}</span></span>
        <span><b>${fmtM(v.total)}</b></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(v.total/maxT*100)}%;background:var(--primary)"></div></div>
      <div style="display:flex;gap:12px;font-size:11px;color:var(--text-muted);margin-top:3px"><span>⛽ ${fmtM(v.comb)}</span><span>🔧 ${fmtM(v.mant)}</span></div>
    </div>`).join(''):'<div class="empty" style="padding:20px"><i class="ti ti-chart-bar"></i>Sin datos.</div>'}
  </div>
  <div class="card">
    <div class="card-title" style="margin-bottom:12px">Tipos de mantenimiento</div>
    ${Object.keys(tipos).length?Object.entries(tipos).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border)">
      <span style="font-size:13px">${t}</span><span class="badge badge-blue">${n}×</span>
    </div>`).join(''):'<div class="empty" style="padding:16px"><i class="ti ti-tool"></i>Sin datos.</div>'}
  </div>
  <div class="card">
    <div class="card-title" style="margin-bottom:12px">Resumen general</div>
    ${[['Vehículos en flotilla',state.vehiculos.length],['Mantenimientos registrados',state.mantenimientos.length],['Cargas de combustible',state.combustible.length],['Gasto total mantenimiento',fmtM(tTotalM)],['Gasto total combustible',fmtM(tTotalC)],['Gasto total flotilla',fmtM(tTotalM+tTotalC)]].map(([l,v])=>`
    <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--border);font-size:13px"><span style="color:var(--text-muted)">${l}</span><b>${v}</b></div>`).join('')}
  </div>`;
}

window.closeModal = () => { document.getElementById('modal-container').innerHTML = ''; };

// ======= CRUD FIREBASE =======
window.doSaveV = async function(id) {
  const n=document.getElementById('fn').value.trim(), p=document.getElementById('fp').value.trim();
  if (!n||!p) { alert('Nombre y placa son requeridos'); return; }
  const data = { nombre:n, placa:p, tipo:document.getElementById('ft').value, año:+document.getElementById('fa').value, odometro:+document.getElementById('fo').value||0 };
  setSyncing();
  try {
    if (id) { await updateDoc(doc(db,'vehiculos',id), data); showToast('Vehículo actualizado ✓'); }
    else { await addDoc(collection(db,'vehiculos'), {...data, createdAt: serverTimestamp()}); showToast('Vehículo agregado ✓'); }
    closeModal();
  } catch(e) { alert('Error al guardar: '+e.message); setSynced(); }
};

window.doSaveM = async function() {
  const t=document.getElementById('ft').value.trim();
  if (!t) { alert('El tipo es requerido'); return; }
  const data = { vehiculoId:document.getElementById('fv').value, tipo:t, fecha:document.getElementById('ff').value, odometro:+document.getElementById('fo').value||0, costo:+document.getElementById('fc').value||0, proximoKm:+document.getElementById('fpk').value||0, taller:document.getElementById('fta').value.trim(), notas:document.getElementById('fno').value.trim(), createdAt:serverTimestamp() };
  setSyncing();
  try { await addDoc(collection(db,'mantenimientos'), data); showToast('Mantenimiento registrado ✓'); closeModal(); }
  catch(e) { alert('Error al guardar: '+e.message); setSynced(); }
};

window.doSaveC = async function() {
  const l=parseFloat(document.getElementById('fl').value);
  if (!l) { alert('Los litros son requeridos'); return; }
  const data = { vehiculoId:document.getElementById('fv').value, fecha:document.getElementById('ff').value, litros:l, precio:parseFloat(document.getElementById('fpr').value)||0, odometro:+document.getElementById('fo').value||0, estacion:document.getElementById('fe').value.trim(), createdAt:serverTimestamp() };
  setSyncing();
  try { await addDoc(collection(db,'combustible'), data); showToast('Carga registrada ✓'); closeModal(); }
  catch(e) { alert('Error al guardar: '+e.message); setSynced(); }
};

window.doDeleteV = async function(id, nombre) {
  if (!confirm(`¿Eliminar ${nombre} y todos sus registros?`)) return;
  setSyncing();
  try {
    await deleteDoc(doc(db,'vehiculos',id));
    // Delete related docs
    for (const m of state.mantenimientos.filter(x=>x.vehiculoId===id)) await deleteDoc(doc(db,'mantenimientos',m.id));
    for (const c of state.combustible.filter(x=>x.vehiculoId===id)) await deleteDoc(doc(db,'combustible',c.id));
    showToast('Vehículo eliminado');
  } catch(e) { alert('Error: '+e.message); setSynced(); }
};

window.doDeleteM = async function(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  setSyncing();
  try { await deleteDoc(doc(db,'mantenimientos',id)); showToast('Registro eliminado'); }
  catch(e) { alert('Error: '+e.message); setSynced(); }
};

window.doDeleteC = async function(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  setSyncing();
  try { await deleteDoc(doc(db,'combustible',id)); showToast('Registro eliminado'); }
  catch(e) { alert('Error: '+e.message); setSynced(); }
};
